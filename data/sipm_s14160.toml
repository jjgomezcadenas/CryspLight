# Hamamatsu S14160-6050HS, 8x8 matrix, 6 mm pitch exactly tiling the 48x48 mm2 face.
# Scalar PDE (peak, 450 nm); the PDE(lambda) curve replaces it with spectrum sampling.
name = "S14160-6050HS"
pitch_mm = 6.0
nx = 8
ny = 8
pde = 0.5

# Device model of the full simulation (docs_fullsim/fullsim_design.tex, Section "Response
# of the SiPM" and Table "Parameters"). Datasheet KAPD1064E (November 2024) unless noted.
[device]
vbr_25c_v = 38.0                 # breakdown at 25 C
dvbr_dt_v_per_k = 0.034          # temperature coefficient of the breakdown
gain_per_volt = 0.93e6           # 2.5e6 at 2.7 V
pde_vov_v = [1.7, 2.7, 3.2, 6.0]     # PDE at 450 nm against the overvoltage; flat above 3.2 V
pde_at_peak = [0.37, 0.50, 0.54, 0.54]
# Spectral factor, 1 at 450 nm: read approximately from the datasheet figure "Photon
# detection efficiency vs. wavelength" (to be digitised properly, working plan task 2.1).
pde_lambda_nm = [350.0, 400.0, 450.0, 480.0, 500.0, 550.0, 600.0, 700.0]
pde_spectral  = [0.62, 0.88, 1.00, 0.93, 0.88, 0.76, 0.64, 0.42]
crosstalk_vov_v = [1.6, 2.7, 3.7, 6.0]   # linear, about 5% per volt
crosstalk       = [0.025, 0.07, 0.13, 0.245]
dark_hz = 6.0e6                  # per device: 2.5 uA typical dark current at 25 C, 2.7 V,
dark_t_k = 298.15                #   gain 2.5e6, crosstalk taken out
dark_vov_v = 2.7
dark_doubling_k = 9.0            # factor 2 every 9 K
afterpulse_prob = 0.01           # 1% at 3 V (literature on the same technology), ~ Vov^2
afterpulse_vov_v = 3.0
afterpulse_tau_ns = 100.0
recovery_ns = 50.0               # cell recharge time constant (quenching resistor x cell
                                 #   capacitance): assumed, not given by the datasheet; a fall of
                                 #   about 60 ns is reported with a pulse-shortening amplifier
                                 #   (Kampert, arXiv:2411.16710)
n_cells = 14331
terminal_capacitance_pf = 2000.0 # datasheet
input_ohm = 50.0                 # input resistance of the electronics (Citiroc: 50 ohm
                                 #   termination of the datasheet; Radioroc2 and DT2745 taken
                                 #   alike until measured). The pulse of one avalanche is the
                                 #   recharge current filtered by input_ohm x 2000 pF = 100 ns:
                                 #   rise to a peak at 69 ns, fall 100 ns (physical_pulse)
