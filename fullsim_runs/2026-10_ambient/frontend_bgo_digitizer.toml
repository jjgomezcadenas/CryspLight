# Front-end stage, BGO ambient read by the DT2745 digitizer (campaign 2026-10_ambient).
# Bench setting: gain 1 and 43 V, that is 5 V above the breakdown at the laboratory
# temperature; threshold 60 counts (about four photoelectrons), majority 2 within 100 ns,
# 10 us records with 1 us before the trigger; gate of 1 us for the 300 ns decay.
[run]
pes = "output/optical_bgo_ambient/pes.h5"
seed = 12
n_events = 0

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 5.0
gain_spread = 0.05
window_ns = [-2500.0, 3000.0]

[frontend]
type = "digitizer"
gain = 1.0
threshold_counts = 60.0
majority = 2
coincidence_ns = 100.0
pretrigger_ns = 1000.0
gate_start_ns = -50.0
gate_ns = 1000.0
baseline_ns = 900.0
noise_counts = 4.0
sample_ns = 8.0
t_start_ns = -2000.0
t_end_ns = 3000.0

[channels]
chip_channels = 64
