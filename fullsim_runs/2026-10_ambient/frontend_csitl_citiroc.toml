# Front-end stage, CsI(Tl) ambient read by the two Citiroc 1A (campaign 2026-10_ambient).
# 2.7 V above the breakdown (dynamic range of the brightest channel); longest shaping,
# peak detector, hold 500 ns for the 730 ns component; single-channel trigger at eight
# photoelectron-equivalents (BGO scan; to be scanned for CsI(Tl)).
[run]
pes = "output/optical_csitl_ambient/pes.h5"
seed = 13
n_events = 0

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 2.7
gain_spread = 0.05
window_ns = [-1500.0, 6000.0]

[frontend]
type = "citiroc"
tp_ns = 87.5
hold_ns = 500.0
peak_detector = true
threshold_pe = 8.0
majority = 1
coincidence_ns = 50.0
noise_pe = 0.1
adc_per_pe = 10.0
pedestal = 200.0
adc_bits = 12
t_start_ns = -200.0
t_end_ns = 6000.0

[channels]
chip_channels = 32
