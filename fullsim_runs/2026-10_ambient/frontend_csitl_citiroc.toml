# Front-end stage, CsI(Tl) ambient read by the two Citiroc 1A (campaign 2026-10_ambient).
# 2.7 V above the breakdown (dynamic range of the brightest channel); high gain at 25 ns
# (calibration), low gain at 87.5 ns (energy), peak detector, hold 500 ns
# for the 730 ns component; single-channel trigger at eight photoelectron-equivalents (BGO
# scan; to be scanned for CsI(Tl)).
[run]
pes = "output/optical_csitl_ambient/pes.h5"
seed = 13
n_events = 10000             # 10k decays for the check of 19 Oct; 50k for the final run

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 2.7
gain_spread = 0.05
window_ns = [-1600.0, 6000.0]

[frontend]
type = "citiroc"
tp_ns = 25.0                 # high gain: calibration on the dark counts (best of the test of 19 Oct)
tp_lg_ns = 87.5              # low gain: energy
hold_ns = 500.0
peak_detector = true
threshold_pe = 8.0   # from the trigger scan of 19 Oct: 511 keV 1.000, 200-300 keV 0.958, dark 0.11 kHz (below 0.51 at 95%)
majority = 1
coincidence_ns = 50.0
noise_pe = 0.1
adc_per_pe = 10.0
pedestal = 200.0
adc_bits = 12
t_start_ns = -200.0
t_end_ns = 6000.0

[channels]
chip_channels = 32
