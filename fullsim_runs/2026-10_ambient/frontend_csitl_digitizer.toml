# Front-end stage, CsI(Tl) ambient read by the DT2745 digitizer (campaign 2026-10_ambient).
# Gain 1 and 43 V (5 V of overvoltage); threshold 120 counts, majority 2 within 100 ns;
# gate of 3 us from 50 ns before the trigger (gate scan of 18 Oct: 5.9% FWHM against 6.2%
# at 4.5 us), baseline window of 900 ns.
[run]
pes = "output/optical_csitl_ambient/pes.h5"
seed = 14
n_events = 0

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 5.0
gain_spread = 0.05
window_ns = [-3200.0, 8000.0]

[frontend]
type = "digitizer"
gain = 1.0
threshold_counts = 120.0
majority = 2
coincidence_ns = 100.0
pretrigger_ns = 1000.0
gate_start_ns = -50.0
gate_ns = 3000.0
baseline_ns = 900.0
noise_counts = 4.0
sample_ns = 8.0
t_start_ns = -2000.0
t_end_ns = 8000.0

[channels]
chip_channels = 64
