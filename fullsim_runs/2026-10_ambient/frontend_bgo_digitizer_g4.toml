# Front-end stage, BGO ambient read by the DT2745 digitiser at gain 4 and 5 V of overvoltage
# (decided 18 Oct 2026: at gain 1 the single-photoelectron peaks of the dark pulses are too
# shallow to calibrate each channel). Threshold 480 counts (7.5 photoelectrons) with
# majority 2 within 100 ns, to be confirmed by the trigger scan; gate and baseline as at gain 1.
[run]
pes = "output/optical_bgo_ambient/pes.h5"
seed = 22
n_events = 10000             # 10k decays for the check of 19 Oct; 50k for the final run

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 5.0
gain_spread = 0.05
window_ns = [-3200.0, 3000.0]

[frontend]
type = "digitizer"
gain = 4.0
threshold_counts = 704.0   # from the trigger scan of 19 Oct: 511 keV 1.000, 200-300 keV 0.997, dark 0.00 kHz (below 0.40 at 95%)
majority = 2
coincidence_ns = 100.0
pretrigger_ns = 1000.0
gate_start_ns = -50.0
gate_ns = 1000.0
baseline_ns = 900.0
noise_counts = 4.0
sample_ns = 8.0
t_start_ns = -2000.0
t_end_ns = 3000.0

[channels]
chip_channels = 64
