# Front-end stage, bgo ambient read by the DT2745 digitizer, option A of the bench
# instructions: digitizer gain 4 and 3.0 V of overvoltage (one photoelectron 38 counts,
# crosstalk 9%, dark rate about 4 MHz per channel), 1 us gate from 50 ns before the
# trigger, baseline window of 900 ns, majority 2 within 100 ns. The threshold is a
# placeholder (7.5 photoelectrons) until the option-A trigger scan sets it.
[run]
pes = "output/optical_bgo_ambient/pes.h5"
seed = 112
n_events = 100000          # the first 100k decays

[sipm]
device = "sipm_s14160"
temperature_k = 293.15
overvoltage_v = 3.0
gain_spread = 0.05
window_ns = [-2500.0, 3000.0]

[frontend]
type = "digitizer"
gain = 4.0
threshold_counts = 192.0   # from the trigger scan of 18 Oct: 511 keV 1.000, 200-300 keV 1.000, dark 0.24 kHz
majority = 2
coincidence_ns = 100.0
pretrigger_ns = 1000.0
gate_start_ns = -50.0
gate_ns = 1000.0
baseline_ns = 900.0
noise_counts = 4.0
sample_ns = 8.0
t_start_ns = -2000.0
t_end_ns = 3000.0

[channels]
chip_channels = 64
